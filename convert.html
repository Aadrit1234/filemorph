<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Converter — Filemorph</title>
  <meta name="description" content="Convert files between formats with 100% content preservation. PDF, DOCX, JPG, PNG, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light')</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <div class="page-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon"><i data-lucide="zap"></i></div>
      <span>Filemorph</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><i data-lucide="menu"></i></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="convert.html" class="active">Convert</a></li>
      <li><a href="transcribe.html">Transcribe</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode"><i data-lucide="moon"></i></button>
  </nav>

  <!-- Main Convert Area -->
  <main class="convert-main">
    <!-- Step 1: Upload -->
    <div class="convert-step" id="stepUpload">
      <div class="upload-zone" id="dropZone">
        <div class="upload-icon">
          <i data-lucide="upload-cloud"></i>
        </div>
        <h2>Drop a file here</h2>
        <p>or click to browse your files</p>
        <div class="upload-formats">
          <span>PDF</span><span>DOCX</span><span>PPTX</span><span>XLSX</span><span>JPG</span><span>PNG</span><span>WebP</span><span>MP3</span><span>WAV</span>
        </div>
        <input type="file" class="file-input-hidden" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.gif,.bmp,.tiff,.tif,.webp,.svg,.txt,.rtf,.csv,.mp3,.wav,.ogg,.m4a,.flac">
      </div>
    </div>

    <!-- Step 2: File Info + Format Selection -->
    <div class="convert-step hidden" id="stepSelect">
      <div class="file-card" id="fileCard">
        <div class="file-card-left">
          <div class="file-type-icon" id="fileTypeIcon">
            <i data-lucide="file"></i>
          </div>
          <div class="file-details">
            <div class="file-name" id="fileName">document.pdf</div>
            <div class="file-meta">
              <span class="file-size" id="fileSize">2.4 MB</span>
              <span class="file-separator">•</span>
              <span class="file-ext" id="fileExt">PDF</span>
            </div>
          </div>
        </div>
        <button class="file-remove" id="removeFile" title="Remove file">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="format-picker">
        <h3>Convert to</h3>
        <div class="format-categories" id="formatTabs">
          <button class="cat-btn active" data-category="all">All</button>
          <button class="cat-btn" data-category="document">Documents</button>
          <button class="cat-btn" data-category="image">Images</button>
          <button class="cat-btn" data-category="text">Text</button>
        </div>
        <div class="format-list" id="formatGrid"></div>
      </div>

      <!-- Convert Button -->
      <div class="action-bar hidden" id="actionBar">
        <button class="convert-btn" id="convertBtn" disabled>
          <i data-lucide="arrow-right-left"></i>
          <span>Convert File</span>
        </button>
      </div>
    </div>

    <!-- Step 3: Converting -->
    <div class="convert-step hidden" id="stepConverting">
      <div class="converting-card">
        <div class="converting-visual">
          <div class="conv-file conv-source">
            <div class="conv-file-icon" id="convSourceIcon"><i data-lucide="file"></i></div>
            <span id="convSourceLabel">PDF</span>
          </div>
          <div class="conv-arrow">
            <div class="conv-arrow-line"></div>
            <div class="conv-arrow-dot"></div>
          </div>
          <div class="conv-file conv-target">
            <div class="conv-file-icon" id="convTargetIcon"><i data-lucide="file"></i></div>
            <span id="convTargetLabel">DOCX</span>
          </div>
        </div>
        <div class="conv-progress">
          <div class="conv-progress-bar">
            <div class="conv-progress-fill" id="convProgressFill"></div>
          </div>
          <div class="conv-status" id="convStatus">Uploading...</div>
        </div>
      </div>
    </div>

    <!-- Step 4: Done -->
    <div class="convert-step hidden" id="stepDone">
      <div class="done-card">
        <div class="done-icon">
          <i data-lucide="check-circle-2"></i>
        </div>
        <h2>Conversion complete</h2>
        <p class="done-info" id="doneInfo">Your file is ready to download</p>
        <div class="done-actions">
          <a class="download-btn" id="downloadBtn" href="#" download>
            <i data-lucide="download"></i>
            <span>Download</span>
          </a>
          <button class="another-btn" id="convertAnotherBtn">
            <i data-lucide="plus"></i>
            <span>Convert another</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/convert.js"></script>
  <script src="js/main.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
